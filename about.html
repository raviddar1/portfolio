<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>רביד דר | עליי</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#ff00a4">
  <style>
    @font-face {
      font-family: 'TheBasics';
      src: url('thebasics/TheBasics-Regular.otf') format('opentype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'TheBasics';
      src: url('thebasics/TheBasics-Light.otf') format('opentype');
      font-weight: 300;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --ink: #111111;
    }

    html { font-size: 18px; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'TheBasics', sans-serif;
      font-weight: 400;
    }

    /* ─── Header ─── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px calc(2rem + 20px);
      z-index: 200;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      direction: ltr;
      background: transparent;
      pointer-events: none;
    }
    header a, header span { pointer-events: all; }

    .nav-title { letter-spacing: -0.08em; }

    .nav-link {
      cursor: pointer;
      transition: color 0.2s ease;
      text-decoration: none;
      color: var(--ink);
      letter-spacing: -0.08em;
    }
    .nav-link:hover { color: #ff00a4; }

    .nav-active {
      color: #ff00a4;
      text-decoration: underline;
      text-decoration-color: #ff00a4;
      text-underline-offset: 4px;
    }

    /* ─── Custom cursor ─── */
    * { cursor: none !important; }
    a, button, .nav-link { cursor: pointer !important; }

    .cursor {
      position: fixed;
      width: 22px;
      height: 22px;
      background: #ff00a4;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      left: 0; top: 0;
      opacity: 0;
      transition: opacity 0.3s;
      will-change: transform;
    }
    .cursor.visible { opacity: 1; }
  </style>
</head>
<body>

  <header>
    <div style="display:flex;gap:1.5rem;align-items:center;">
      <a class="nav-link nav-active" href="about.html">[ עליי ]</a>
      <a class="nav-link" href="index.html">[ פרויקטים ]</a>
    </div>
    <a href="index.html" class="nav-title" style="font-size:20px;color:#ff00a4;text-decoration:none;">רבידר</a>
  </header>

  <div class="cursor" id="cursor"></div>

  <div style="
    position: fixed;
    left: calc(2rem + 20px);
    top: 50%;
    transform: translateY(-50%);
    width: 22vw;
    height: 58vh;
    overflow: hidden;
  ">
    <img src="אני .jpg" alt="רביד דר" style="width:100%;height:100%;object-fit:cover;object-position:center top;">
  </div>

  <div style="
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
    padding: 6rem calc(2rem + 20px) 0;
    pointer-events: none;
  ">
    <div style="
      position: relative;
      max-width: 470px;
      text-align: right;
      font-size: 0.78rem;
      line-height: 1.25;
      direction: rtl;
      transform: translate(-290px, 100px);
      pointer-events: all;
    ">
      <span style="position:absolute;right:-18px;top:-16px;display:block;width:16px;height:16px;background:#EAFF09;"></span>
      <p id="about-line1"></p>
      <br id="about-br" style="display:none;">
      <p id="about-line2"></p>
      <br id="about-br2" style="display:none;">
      <p id="about-links" style="letter-spacing:-0.02em;opacity:0;"></p>
    </div>
  </div>

  <script>
    /* ── Typewriter ── */
    (function() {
      const line1el = document.getElementById('about-line1');
      const line2el = document.getElementById('about-line2');
      const linksEl = document.getElementById('about-links');
      const br1 = document.getElementById('about-br');
      const br2 = document.getElementById('about-br2');

      const line1 = 'אז כמו שאמרתי מקודם... אני רביד דר, בוגרת המחלקה לתקשורת חזותית באוניברסיטת חיפה (ויצו).';
      const line2 = 'בזמני הפנוי אני אוהבת לטייל, לנגן על תופים ולחפש השראה במקומות לא צפויים. אני נמשכת לכל מה שקשור לעיצוב, צבע, טיפוגרפיה וטכנולוגיה, ואוהבת להפוך רעיונות מורכבים לחוויות פשוטות, מדויקות ומהנות. חוץ מזה, מבחינתי כל שעה היא שעה טובה לקפה ומאפה, ואם יש כלבים במשרד - כנראה שכבר ארגיש בבית.';

      let i = 0;
      function typeLine1() {
        if (i < line1.length) { line1el.textContent += line1[i++]; setTimeout(typeLine1, 28); }
        else { br1.style.display = ''; i = 0; setTimeout(typeLine2, 150); }
      }
      function typeLine2() {
        if (i < line2.length) { line2el.textContent += line2[i++]; setTimeout(typeLine2, 18); }
        else {
          br2.style.display = '';
          linksEl.innerHTML = '<a href="#" style="color:var(--ink);text-decoration:none;cursor:pointer;">[ קורות חיים ]</a>&nbsp;&nbsp;<a href="#" style="color:var(--ink);text-decoration:none;cursor:pointer;">[ cv ]</a>';
          linksEl.style.opacity = '1';
        }
      }
      setTimeout(typeLine1, 400);
    })();

    const cursor = document.getElementById('cursor');
    window.addEventListener('mousemove', e => {
      cursor.style.transform = `translate(calc(${e.clientX}px - 50%), calc(${e.clientY}px - 50%))`;
      const over = document.elementFromPoint(e.clientX, e.clientY);
      const isInteractive = over && over.closest('a, button, .nav-link');
      cursor.classList.toggle('visible', !isInteractive);
    }, { passive: true });
    document.addEventListener('mouseleave', () => cursor.classList.remove('visible'));
  </script>

</body>
</html>
